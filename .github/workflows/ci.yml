name: CI/CD to Docker Hub & Local Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.dockerignore'
      - 'implementation_plan.md'
      - 'task.md'
      - 'walkthrough.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: pockyextrafine
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            pockyextrafine/steam-summarizer:latest
            pockyextrafine/steam-summarizer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: pockyextrafine
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        shell: powershell
        run: docker pull pockyextrafine/steam-summarizer:latest

      - name: Stop and Remove Existing Container
        shell: powershell
        run: |
          $containerName = "steam-summarizer"
          $exists = docker ps -aq --filter "name=$containerName"
          if ($exists) {
              docker stop $containerName
              docker rm $containerName
          }

      - name: Run New Container
        shell: pwsh
        run: |
          docker run -d --name steam-summarizer -p 8000:8000 pockyextrafine/steam-summarizer:latest