<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Review AI Summarizer</title>
    <meta name="description" content="Use AI to summarize Steam game reviews instantly.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Abstract background elements -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header class="hero">
            <h1 class="title">Steam Review <span class="gradient-text">AI Summarizer</span></h1>
            <p class="subtitle">Instantly understand what players think. Enter a game name or App ID to extract and summarize user opinions in seconds.</p>
        </header>

        <section class="search-section glass-panel">
            <form id="search-form">
                <div class="input-group">
                    <input type="text" id="query-input" placeholder="e.g. Stardew Valley, Cyberpunk 2077, or 413150" required autocomplete="off">
                    <button type="submit" id="submit-btn" class="primary-btn">
                        <span class="btn-text">Summarize</span>
                        <div class="loader hidden" id="btn-loader"></div>
                    </button>
                </div>
            </form>
            <div id="error-message" class="error-msg hidden"></div>
        </section>

        <!-- Use an ID for targeting -->
        <section id="results" class="results-section hidden">
            <div class="glass-panel result-card">
                <div class="result-header">
                    <h2>AI Summary</h2>
                    <span id="review-count" class="badge">Analyzed 10 reviews</span>
                </div>
                <div class="result-body">
                    <p id="summary-text" class="summary-text"></p>
                </div>
                <div class="result-footer">
                    <a id="steam-link" href="#" target="_blank" class="steam-link">View on Steam Store</a>
                </div>
            </div>
        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
